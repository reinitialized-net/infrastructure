# Managed by Nix. Edit this file, then rebuild apps3; UI edits are replaced on restart.
version: 0.18-0
mqtt:
  enabled: false
auth:
  enabled: true
  cookie_secure: true
  failed_login_rate_limit: "5/minute"
tls:
  enabled: false # rp1 terminates HTTPS; backend traffic travels over WireGuard.
networking:
  listen:
    internal: "127.0.0.1:5000"
go2rtc:
  # Share one camera connection per stream and copy H.264 without encoding.
  streams:
    # TP-Link Tapo cameras on the untrusted VLAN 14. Credentials are the
    # per-camera "Camera Account" from the Tapo app, URL-encoded in the env
    # file. RTSP over TCP: the stateful VLAN firewall has no RTSP helper, so
    # camera-initiated UDP RTP would not pass. stream1 records, stream2 detects.
    # timeout=30 replaces go2rtc's 5 s read deadline: shared Wi-Fi blips of
    # 5-15 s dropped all four producers at once, and Frigate's record ffmpeg then
    # sat on the dead restream until its fixed 120 s watchdog (~105 s holes).
    # TCP rides out the blip instead. Fragment params also disable backchannel.
    camera_14_2:
      - "rtsp://{FRIGATE_CAMERA_14_2_USER}:{FRIGATE_CAMERA_14_2_PASSWORD}@10.1.14.2:554/stream1#timeout=30"
    camera_14_2_sub:
      - "rtsp://{FRIGATE_CAMERA_14_2_USER}:{FRIGATE_CAMERA_14_2_PASSWORD}@10.1.14.2:554/stream2#timeout=30"
    camera_14_3:
      - "rtsp://{FRIGATE_CAMERA_14_3_USER}:{FRIGATE_CAMERA_14_3_PASSWORD}@10.1.14.3:554/stream1#timeout=30"
    camera_14_3_sub:
      - "rtsp://{FRIGATE_CAMERA_14_3_USER}:{FRIGATE_CAMERA_14_3_PASSWORD}@10.1.14.3:554/stream2#timeout=30"
    # Stable camera ID preserves Geckos3 history after its move from .5 to .4.
    camera_14_5:
      - "rtsp://{FRIGATE_CAMERA_14_5_USER}:{FRIGATE_CAMERA_14_5_PASSWORD}@10.1.14.4:554/stream1#timeout=30"
    camera_14_5_sub:
      - "rtsp://{FRIGATE_CAMERA_14_5_USER}:{FRIGATE_CAMERA_14_5_PASSWORD}@10.1.14.4:554/stream2#timeout=30"
    camera_14_14:
      - "rtsp://{FRIGATE_CAMERA_14_14_USER}:{FRIGATE_CAMERA_14_14_PASSWORD}@10.1.14.5:554/stream1#timeout=30"
    camera_14_14_sub:
      - "rtsp://{FRIGATE_CAMERA_14_14_USER}:{FRIGATE_CAMERA_14_14_PASSWORD}@10.1.14.5:554/stream2#timeout=30"
  api:
    listen: "127.0.0.1:1984"
  rtsp:
    listen: "127.0.0.1:8554"
  webrtc:
    listen: "127.0.0.1:8555"
# The VM has an AVX2-capable Intel CPU but no accelerator passthrough.
# OpenVINO avoids the default TFLite detector's ~271 ms inference latency.
detectors:
  ov:
    type: openvino_cpu
    device: CPU
    # Three inference workers leave capacity for capture and the shared host.
    num_threads: 3
# One-class gecko detector trained on this installation's own night footage
# (see docs/gecko-tracking.md). Frigate runs a single model, so every camera
# that enables detection sees only the "gecko" label.
model:
  path: /models/gecko.onnx
  model_type: yolo-generic
  labelmap_path: /models/gecko-labelmap.txt
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
detect:
  enabled: true
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 30
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion
snapshots:
  enabled: false
camera_groups:
  Geckos:
    cameras: [camera_14_2, camera_14_3, camera_14_5, camera_14_14]
    icon: LuBug
    order: 0
cameras:
  # Gecko enclosure template. Everything gecko-specific lives on this first
  # camera and is merged into the others with "<<: *gecko_camera"; each of
  # those overrides only its own streams. New gecko cameras copy camera_14_3.
  camera_14_2: &gecko_camera
    friendly_name: Geckos1
    live:
      streams:
        "Full resolution": camera_14_2
        "Sub stream": camera_14_2_sub
    ffmpeg:
      inputs:
        # Record the 2560x1440 main stream by copy: full quality, no decode.
        - path: rtsp://127.0.0.1:8554/camera_14_2
          input_args: preset-rtsp-restream
          roles: [record]
        # Frigate requires a detect input; the sub stream feeds motion and keeps
        # capture and the health check alive for ~0.04 core versus ~0.28 core for the 1440p stream
        # (measured 2026-09-22 on apps3; four 1440p decodes starved the 4 vCPUs).
        # Gecko detection needs the main stream at 1280x720 (geckos ~100 px there,
        # ~25 px here): move detect back to it before re-enabling detection.
        - path: rtsp://127.0.0.1:8554/camera_14_2_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    detect:
      enabled: false
      width: 640
      height: 360
      fps: 5
      stationary:
        # 10 s without movement (at 5 fps) marks a gecko stationary, which ends
        # its active_objects recording. The visual classifier ignores box jitter.
        threshold: 50
        classifier: true
    motion:
      # Drives the review timeline's motion bars. Tuned 2026-09-24 with Frigate's
      # own detector on 640x360 sub-stream and downscaled recordings (night and
      # day, all four cameras): gecko movement on branches/decor registers,
      # still enclosures stay at zero. The previous 360/20/10 fired in 83-100% of
      # segments on IR/compression noise. People in view, the IR/colour switch
      # and the first seconds after a restart still register. Do not set
      # skip_motion_threshold: in 0.18 it never relearns the background and
      # suppresses all motion from startup.
      enabled: true
      frame_height: 180
      threshold: 40
      contour_area: 30
      improve_contrast: true
      mask:
        timestamp:
          friendly_name: Camera timestamp overlay
          coordinates: "0,0,0.36,0,0.36,0.05,0,0.05"
    objects:
      track: [gecko]
      filters:
        gecko:
          min_score: 0.45
          threshold: 0.6
    review:
      alerts:
        enabled: false
      detections:
        labels: [gecko]
    # Snapshot of each tracked gecko with its labelled bounding box, shown in
    # Explore/Review. Live boxes need no config: the camera Debug view and
    # /api/<camera>/latest.jpg?bbox=1 draw them from the same tracker state.
    snapshots:
      enabled: true
      bounding_box: true
      timestamp: true
      retain:
        default: 30
    record:
      enabled: true
      # Required: record 24/7 and keep at least one week of everything.
      # Measured ~7 GB/day/camera, ~200 GB/week for four cameras; the storage
      # guard in frigate.nix stops Frigate below 100 GiB free, so recheck
      # capacity before raising retention or adding cameras.
      continuous:
        days: 7
      motion:
        days: 7
      alerts:
        retain:
          days: 0
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 30
          mode: active_objects
  camera_14_3:
    <<: *gecko_camera
    friendly_name: Geckos2
    live:
      streams:
        "Full resolution": camera_14_3
        "Sub stream": camera_14_3_sub
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_14_3
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/camera_14_3_sub
          input_args: preset-rtsp-restream
          roles: [detect]
  camera_14_5:
    <<: *gecko_camera
    friendly_name: Geckos3
    live:
      streams:
        "Full resolution": camera_14_5
        "Sub stream": camera_14_5_sub
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_14_5
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/camera_14_5_sub
          input_args: preset-rtsp-restream
          roles: [detect]
  camera_14_14:
    <<: *gecko_camera
    friendly_name: Geckos4
    live:
      streams:
        "Full resolution": camera_14_14
        "Sub stream": camera_14_14_sub
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_14_14
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/camera_14_14_sub
          input_args: preset-rtsp-restream
          roles: [detect]
