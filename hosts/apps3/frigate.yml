# Managed by Nix. Edit this file, then rebuild apps3; UI edits are replaced on restart.
version: 0.18-0
mqtt:
  enabled: false
auth:
  enabled: true
  cookie_secure: true
  failed_login_rate_limit: "5/minute"
tls:
  enabled: false # rp1 terminates HTTPS; backend traffic travels over WireGuard.
networking:
  listen:
    internal: "127.0.0.1:5000"
go2rtc:
  # Share one camera connection and copy H.264 without encoding. IP Webcam's
  # RTSP SDP advertises stale landscape SPS for portrait video. Reading MPEG-TS
  # lets go2rtc derive live dimensions from the actual in-band video headers.
  # Separate on-demand connections were faster but failed camera recovery
  # qualification. Do not reintroduce connection churn without retesting it.
  streams:
    camera_13_37:
      - "ffmpeg:{FRIGATE_CAMERA_13_37_URL}#input=rtsp/udp#video=copy"
    # TP-Link Tapo cameras on the untrusted VLAN 14. Credentials are the
    # per-camera "Camera Account" from the Tapo app, URL-encoded in the env
    # file. RTSP over TCP: the stateful VLAN firewall has no RTSP helper, so
    # camera-initiated UDP RTP would not pass. stream1 records, stream2 detects.
    camera_14_2:
      - "rtsp://{FRIGATE_CAMERA_14_2_USER}:{FRIGATE_CAMERA_14_2_PASSWORD}@10.1.14.2:554/stream1"
    camera_14_2_sub:
      - "rtsp://{FRIGATE_CAMERA_14_2_USER}:{FRIGATE_CAMERA_14_2_PASSWORD}@10.1.14.2:554/stream2"
    camera_14_3:
      - "rtsp://{FRIGATE_CAMERA_14_3_USER}:{FRIGATE_CAMERA_14_3_PASSWORD}@10.1.14.3:554/stream1"
    camera_14_3_sub:
      - "rtsp://{FRIGATE_CAMERA_14_3_USER}:{FRIGATE_CAMERA_14_3_PASSWORD}@10.1.14.3:554/stream2"
    camera_14_5:
      - "rtsp://{FRIGATE_CAMERA_14_5_USER}:{FRIGATE_CAMERA_14_5_PASSWORD}@10.1.14.5:554/stream1"
    camera_14_5_sub:
      - "rtsp://{FRIGATE_CAMERA_14_5_USER}:{FRIGATE_CAMERA_14_5_PASSWORD}@10.1.14.5:554/stream2"
  ffmpeg:
    # IP Webcam delivers periodic keyframes over UDP but loses them over TCP.
    # Force UDP only on the camera leg; Frigate's local restream remains TCP.
    rtsp/udp: -fflags nobuffer -flags low_delay -timeout {timeout} -user_agent go2rtc/ffmpeg -rtsp_transport udp -i {input}
    output: -f mpegts -
  api:
    listen: "127.0.0.1:1984"
  rtsp:
    listen: "127.0.0.1:8554"
  webrtc:
    listen: "127.0.0.1:8555"
# The VM has an AVX2-capable Intel CPU but no accelerator passthrough.
# OpenVINO avoids the default TFLite detector's ~271 ms inference latency.
detectors:
  ov:
    type: openvino_cpu
    device: CPU
    # Three inference workers leave capacity for capture and the shared host.
    num_threads: 3
# One-class gecko detector trained on this installation's own night footage
# (see docs/gecko-tracking.md). Frigate runs a single model, so every camera
# that enables detection sees only the "gecko" label.
model:
  path: /models/gecko.onnx
  model_type: yolo-generic
  labelmap_path: /models/gecko-labelmap.txt
  width: 320
  height: 320
  input_tensor: nchw
  input_pixel_format: rgb
  input_dtype: float
detect:
  enabled: true
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 30
  alerts:
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 30
      mode: motion
snapshots:
  enabled: false
camera_groups:
  Geckos:
    cameras: [camera_14_2, camera_14_3, camera_14_5]
    icon: LuBug
    order: 0
cameras:
  camera_13_37:
    # Replaced by the VLAN 14 cameras on 2026-09-17. The device is permanently
    # offline. Kept disabled (not removed) so its ~500 GB of retained footage
    # stays viewable; Frigate deletes recordings of cameras missing from config.
    enabled: false
    record:
      motion:
        days: 3650
    objects:
      track: [] # The gecko model has no "person"; silence the startup warning.
    motion:
      # The default 100-pixel height reduces this portrait view to 56x100,
      # losing small geckos. 180x320 motion analysis preserves the tested small
      # targets with much less processing time than using the full 360x640.
      frame_height: 320
      # Requalified against the current enclosure: 15/5 still missed two of
      # five small, low-contrast synthetic targets. Watch reflection noise.
      threshold: 10
      contour_area: 3
      improve_contrast: true
    live:
      streams:
        "Full resolution": camera_13_37
    ffmpeg:
      output_args:
        # Smaller files also bound Frigate's HLS playback chunks, reducing the
        # data fetched for each seek. Cut only at source keyframes; never encode.
        record: -f segment -segment_time 5 -segment_format mp4 -reset_timestamps 1 -strftime 1 -c copy -an
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_13_37
          input_args: preset-rtsp-restream
          roles: [record]
        - path: "{FRIGATE_CAMERA_13_37_SNAPSHOT_URL}"
          # IP Webcam serves a fresh JPEG per request. Pace requests before
          # decoding: output fps alone still decodes every H.264 source frame.
          # Keep image2's 1/5-second timestamps. Wall-clock timestamps caused
          # this looped input to deliver bursts that overflowed capture.
          input_args: -re -loop 1 -framerate 5 -f image2
          roles: [detect]
    detect:
      # Keep motion analysis small; live view uses the original go2rtc stream.
      # Only five camera snapshots per second are decoded; recording and live
      # viewing copy the independent original H.264 stream at its source FPS.
      # COCO has no gecko class. Motion is evaluated independently and still
      # controls recording; avoid blocking its frames on unrelated inference.
      enabled: false
      width: 360
      height: 640
      fps: 5
  # Gecko enclosure template. Everything gecko-specific lives on this first
  # camera and is merged into the others with "<<: *gecko_camera"; each of
  # those overrides only its own streams. New gecko cameras copy camera_14_3.
  camera_14_2: &gecko_camera
    friendly_name: Geckos1
    live:
      streams:
        "Full resolution": camera_14_2
        "Sub stream": camera_14_2_sub
    ffmpeg:
      inputs:
        # Detect from the 1440p stream: geckos are ~100 px there and ~25 px on
        # the 640x360 sub stream. Decoding 1440p at 20 fps measured ~0.27 core.
        - path: rtsp://127.0.0.1:8554/camera_14_2
          input_args: preset-rtsp-restream
          roles: [detect, record]
    detect:
      width: 1280
      height: 720
      fps: 5
      stationary:
        # 10 s without movement (at 5 fps) marks a gecko stationary, which ends
        # its active_objects recording. The visual classifier ignores box jitter.
        threshold: 50
        classifier: true
    motion:
      # Motion only chooses where the detector looks. Half-resolution analysis
      # keeps a resting gecko's small first movements visible.
      frame_height: 360
      threshold: 20
      contour_area: 10
      improve_contrast: true
      mask:
        timestamp:
          friendly_name: Camera timestamp overlay
          coordinates: "0,0,0.36,0,0.36,0.05,0,0.05"
    objects:
      track: [gecko]
      filters:
        gecko:
          min_score: 0.45
          threshold: 0.6
    review:
      alerts:
        enabled: false
      detections:
        labels: [gecko]
    # Snapshot of each tracked gecko with its labelled bounding box, shown in
    # Explore/Review. Live boxes need no config: the camera Debug view and
    # /api/<camera>/latest.jpg?bbox=1 draw them from the same tracker state.
    snapshots:
      enabled: true
      bounding_box: true
      timestamp: true
      retain:
        default: 30
    record:
      enabled: true
      # Retain only footage where a tracked gecko is active (moving); no plain
      # motion retention on gecko cameras. Stationary geckos are still tracked
      # so their next movement records without waiting for a fresh detection.
      # Interim (2026-09-18): keep everything while the gecko model is rebuilt on
      # day and night footage; ~6 GB/day/camera. Restore both to 0 afterwards.
      continuous:
        days: 3
      motion:
        days: 7
      alerts:
        retain:
          days: 0
      detections:
        pre_capture: 5
        post_capture: 5
        retain:
          days: 30
          mode: active_objects
  camera_14_3:
    <<: *gecko_camera
    friendly_name: Geckos2
    live:
      streams:
        "Full resolution": camera_14_3
        "Sub stream": camera_14_3_sub
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_14_3
          input_args: preset-rtsp-restream
          roles: [detect, record]
  camera_14_5:
    <<: *gecko_camera
    friendly_name: Geckos3
    live:
      streams:
        "Full resolution": camera_14_5
        "Sub stream": camera_14_5_sub
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/camera_14_5
          input_args: preset-rtsp-restream
          roles: [detect, record]
