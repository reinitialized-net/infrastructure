# Keep repository analysis and remediation inside a managed, least-privilege
# filesystem boundary. This profile is also inherited by Codex Security's
# read-only deep-scan workers.
default_permissions = "infrastructure-local"

[permissions.infrastructure-local]
description = "Local infrastructure review and workspace-scoped remediation."
extends = ":workspace"

[permissions.infrastructure-local.filesystem.":workspace_roots"]
# Live secrets are intentionally outside source review. The checked-in
# modules/secrets.example templates remain available to the scanner.
"modules/secrets" = "deny"

[permissions.infrastructure-local.network]
# Repository scanning and synthetic checks do not require access to production
# hosts or external services. Hosted Codex tools have separate controls.
enabled = false
